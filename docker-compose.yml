version: '3.8'

services:
  story_app:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "7999:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - edu_tw_network

  db:
    image: mysql:8.0
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: story
      MYSQL_USER: dev
      MYSQL_PASSWORD: dev1234
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - edu_tw_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
    depends_on:
      db:
        condition: service_healthy
    networks:
      - edu_tw_network

volumes:
  db_data:
    driver: local

networks:
  edu_tw_network:
    external: true
